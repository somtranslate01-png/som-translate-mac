name: Build Mac app
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange sources
        run: |
          mkdir -p Sources/SomTranslateMac
          mv main.swift AppDelegate.swift HotKey.swift OCR.swift RegionPicker.swift ScreenCapture.swift SubtitleWindow.swift Translator.swift Sources/SomTranslateMac/
      - name: Compile errors only
        continue-on-error: true
        run: |
          swift build -c release 2>&1 | grep -E 'error:' | sed 's|.*/Sources/||' | sort -u | head -60
      - name: Build
        run: |
          chmod +x build-app.sh
          ./build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SomTranslateMac
          path: build/SomTranslateMac.zip
