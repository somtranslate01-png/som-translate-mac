name: Build Mac app
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange sources
        run: |
          mkdir -p Sources/SomTranslateMac
          mv main.swift AppDelegate.swift HotKey.swift OCR.swift RegionPicker.swift ScreenCapture.swift SubtitleWindow.swift Translator.swift Sources/SomTranslateMac/
      - name: Compile check (arm64)
        continue-on-error: true
        run: |
          swift build -c release --arch arm64 > out.txt 2>&1 || true
          echo "::notice::lines=$(wc -l < out.txt)"
          grep -E 'error' out.txt | sort -u | head -9 | while IFS= read -r l; do echo "::error::${l##*/Sources/}"; done
          tail -4 out.txt | while IFS= read -r l; do echo "::notice::${l##*/Sources/}"; done
      - name: Build
        run: |
          chmod +x build-app.sh
          ./build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SomTranslateMac
          path: build/SomTranslateMac.zip
